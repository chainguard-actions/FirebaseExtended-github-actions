name: Test workload identity auth without OIDC fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create testapp
        run: |
          mkdir -p ftl-apps
          echo "fake apk" > ftl-apps/app.apk
      - id: action
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/test-pool/providers/test-provider
          service_account: test-sa@fake-project.iam.gserviceaccount.com
          testapp_dir: ftl-apps
          test_type: robo
          test_devices: model=redfin,version=30
      - name: Assert action failed during authentication
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no OIDC token available for workload identity)"
            exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            echo "FAIL: FTL step should not have run, but test_summary is set"
            exit 1
          fi
          echo "PASS"
