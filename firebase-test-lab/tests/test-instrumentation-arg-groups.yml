name: Test instrumentation with arg groups
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and instrumentation zip
        run: |
          bash tests/fixtures/setup-fake-env.sh
          mkdir -p "$RUNNER_TEMP/build" "$RUNNER_TEMP/testapps"
          cd "$RUNNER_TEMP/build"
          echo "app" > app-debug.apk
          echo "test" > app-debug-test.apk
          python3 -c "import zipfile; z=zipfile.ZipFile('$RUNNER_TEMP/testapps/app.zip','w'); z.write('app-debug.apk'); z.write('app-debug-test.apk'); z.close()"
      - id: action
        uses: .
        with:
          testapp_dir: ${{ runner.temp }}/testapps
          test_type: instrumentation
          arg_groups: args.yaml:group1;args.yaml:group2
      - name: Assert test summary
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          def check(cond, msg):
              if not cond:
                  print("FAIL: " + msg); sys.exit(1)
          apps = s["apps"]
          check(len(apps) == 2, "one run per arg group")
          groups = sorted(a["cmd"].split()[-1] for a in apps)
          check(groups == ["args.yaml:group1", "args.yaml:group2"], "arg groups appended: %s" % groups)
          for a in apps:
              cmd = a["cmd"]
              check(cmd.startswith("gcloud firebase test android run --app "), "android cmd: " + cmd)
              parts = cmd.split()
              app = parts[parts.index("--app") + 1]
              test = parts[parts.index("--test") + 1]
              check(app.endswith("/app/app-debug.apk"), "app apk: " + app)
              check(test.endswith("/app/app-debug-test.apk"), "test apk: " + test)
              check("--type instrumentation --timeout 600s" in cmd, "type: " + cmd)
              check(a["return_code"] == 0, "return_code")
          print("PASS")
          EOF
