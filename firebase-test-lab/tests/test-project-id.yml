name: Test project_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create testapp
        run: |
          mkdir -p ftl-apps
          echo "fake apk" > ftl-apps/app.apk
      - id: action
        uses: .
        with:
          project_id: my-test-project
          testapp_dir: ftl-apps
          test_type: robo
          test_devices: model=redfin,version=30
      - name: Assert test summary
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          python3 - <<'EOF'
          import json, os, sys
          def fail(m):
              print("FAIL: " + m); sys.exit(1)
          s = json.loads(os.environ["SUMMARY"])
          apps = s["apps"]
          if len(apps) != 1: fail("expected 1 app, got %d" % len(apps))
          a = apps[0]
          if a["return_code"] != 0: fail("return_code not 0")
          if a["test_type"] != "robo": fail("test_type wrong")
          if "--type robo" not in a["cmd"]: fail("cmd wrong: " + a["cmd"])
          print("PASS")
          EOF
