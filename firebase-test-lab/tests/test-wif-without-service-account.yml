name: Test workload_identity_provider without service_account skips auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: my-test-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup environment
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-env.sh"
      - name: Create fake gcloud and testapp
        run: |
          mkdir -p /tmp/ftl-apps/robo
          echo "fake apk" > /tmp/ftl-apps/robo/app.apk
          cat > /tmp/ftl-fakebin/gcloud <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/ftl-gcloud-calls.log
          echo "Test results will be streamed to [https://console.firebase.google.com/project/my-test-project/testlab/histories/h1/matrices/m1]."
          echo "Raw results will be stored in your GCS bucket at [https://console.developers.google.com/storage/browser/test-bucket/run1/]"
          echo "OUTCOME: Passed"
          echo "TEST_AXIS_VALUE: redfin-30-en-portrait"
          echo "TEST_DETAILS: --"
          exit 0
          EOF
          chmod +x /tmp/ftl-fakebin/gcloud
      - id: action
        uses: .
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/pool/providers/provider
          service_account: ''
          testapp_dir: /tmp/ftl-apps/robo
          test_type: robo
          test_devices: model=redfin,version=30
      - name: Assert auth skipped and fake gcloud used
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS:-}'"
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "FAIL: auth step should have been skipped"; exit 1
          fi
          if [ "$(wc -l < /tmp/ftl-gcloud-calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly 1 fake gcloud call"; exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          if s.get("project_id") != "my-test-project":
              print("FAIL: project_id %r" % s.get("project_id")); sys.exit(1)
          apps = s["apps"]
          if len(apps) != 1 or apps[0]["return_code"] != 0:
              print("FAIL: apps %r" % apps); sys.exit(1)
          print("PASS")
          EOF
