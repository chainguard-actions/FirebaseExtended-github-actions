name: Test credentials_json triggers auth path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup environment
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-env.sh"
      - name: Create fake testapp
        run: |
          mkdir -p /tmp/ftl-apps/robo
          echo "fake apk" > /tmp/ftl-apps/robo/app.apk
      # The fake service-account key cannot authenticate against real Google
      # Cloud, so the auth/setup-gcloud/FTL chain may fail. We assert on the
      # outcome and, where auth ran, on what it exported.
      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials_json: '{"type":"service_account","project_id":"fake-sa-project","private_key_id":"abc123","private_key":"-----BEGIN PRIVATE KEY-----\nMIIBVQIBADANBgkqhkiG9w0BAQEFAASCAT8wggE7AgEAAkEAfake\n-----END PRIVATE KEY-----\n","client_email":"fake@fake-sa-project.iam.gserviceaccount.com","client_id":"1234567890","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          testapp_dir: /tmp/ftl-apps/robo
          test_type: robo
          test_devices: model=redfin,version=30
      - name: Assert auth path outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "GOOGLE_APPLICATION_CREDENTIALS='${GOOGLE_APPLICATION_CREDENTIALS:-}'"
          echo "GCLOUD_PROJECT='${GCLOUD_PROJECT:-}'"
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
              echo "FAIL: credentials file not found"; exit 1
            fi
            if ! grep -q "fake-sa-project" "$GOOGLE_APPLICATION_CREDENTIALS"; then
              echo "FAIL: credentials file does not contain provided key"; exit 1
            fi
            echo "auth step exported credentials file"
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUMMARY" ]; then
              echo "FAIL: success but empty summary"; exit 1
            fi
            echo "$SUMMARY" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["apps"], "no apps"'
            echo "PASS: action succeeded with summary"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake credentials cannot authenticate)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
