name: Test game-loop with custom validator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create testapps and validator
        run: |
          mkdir -p ftl-game
          echo "fake ipa" > ftl-game/game.ipa
          cat > "$GITHUB_WORKSPACE/ftl_validator.py" <<'EOF'
          def validate(test_summary):
              # Reject first attempt to force a retry.
              return test_summary.get("attempt", 1) >= 2
          EOF
      - id: action
        uses: .
        with:
          testapp_dir: ftl-game
          test_type: game-loop
          max_attempts: 3
          validator: ${{ github.workspace }}/ftl_validator.py
      - name: Assert validator forced exactly one retry
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          def fail(m):
              print("FAIL: " + m); sys.exit(1)
          apps = s["apps"]
          if len(apps) != 2: fail("expected 2 attempts, got %d" % len(apps))
          for a in apps:
              if not a["cmd"].startswith("gcloud beta firebase test ios run"): fail("ipa should use beta ios cmd: " + a["cmd"])
              if "--type game-loop" not in a["cmd"]: fail("type wrong")
          print("PASS")
          EOF
