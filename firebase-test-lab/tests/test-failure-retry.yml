name: Test failing FTL run with retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud that fails
        run: |
          bash tests/fixtures/setup-fake-env.sh
          echo 10 > /tmp/fake-gcloud-exit
          echo Failed > /tmp/fake-gcloud-outcome
          mkdir -p "$RUNNER_TEMP/testapps"
          echo "fake apk" > "$RUNNER_TEMP/testapps/app.apk"
      - id: action
        uses: .
        continue-on-error: true
        with:
          testapp_dir: ${{ runner.temp }}/testapps
          test_type: robo
          max_attempts: 2
      - name: Assert failure with two attempts
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          cat /tmp/fake-gcloud-calls.log || true
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          CALLS=$(wc -l < /tmp/fake-gcloud-calls.log)
          if [ "$CALLS" -ne 2 ]; then echo "FAIL: expected 2 gcloud calls, got $CALLS"; exit 1; fi
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          apps = s["apps"]
          def check(cond, msg):
              if not cond:
                  print("FAIL: " + msg); sys.exit(1)
          check(len(apps) == 2, "two attempts recorded")
          check(sorted(a["attempt"] for a in apps) == [1, 2], "attempts 1 and 2")
          for a in apps:
              check(a["return_code"] == 10, "return_code 10")
              check(a["devices"][0]["outcome"] == "Failed", "outcome Failed")
          print("PASS")
          EOF
