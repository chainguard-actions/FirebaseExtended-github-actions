name: Test no testapps found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup environment
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-env.sh"
      - name: Create fake gcloud and empty testapp dir
        run: |
          mkdir -p /tmp/ftl-apps/empty
          echo "not an app" > /tmp/ftl-apps/empty/notes.txt
          cat > /tmp/ftl-fakebin/gcloud <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/ftl-gcloud-calls.log
          exit 0
          EOF
          chmod +x /tmp/ftl-fakebin/gcloud
      - id: action
        uses: .
        continue-on-error: true
        with:
          testapp_dir: /tmp/ftl-apps/empty
          test_type: robo
      - name: Assert action failed without calling gcloud
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          if [ -s /tmp/ftl-gcloud-calls.log ]; then
            echo "FAIL: gcloud should not have been called"; cat /tmp/ftl-gcloud-calls.log; exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            echo "FAIL: expected empty test_summary"; exit 1
          fi
          echo "PASS"
