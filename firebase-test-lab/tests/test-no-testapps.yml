name: Test no testapps found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create empty testapp dir
        run: |
          mkdir -p ftl-empty
          echo "not an app" > ftl-empty/notes.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          testapp_dir: ftl-empty
          test_type: robo
      - name: Assert failure and no gcloud invocation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: '$SUMMARY'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            echo "FAIL: expected empty summary"
            exit 1
          fi
          if [ -s /tmp/fake-gcloud-calls.log ]; then
            echo "FAIL: gcloud should not have been called"
            exit 1
          fi
          echo "PASS"
