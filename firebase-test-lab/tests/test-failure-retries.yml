name: Test failed FTL run with retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_GCLOUD_EXIT: "10"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create testapp
        run: |
          mkdir -p ftl-apps
          echo "fake apk" > ftl-apps/app.apk
      - id: action
        uses: .
        continue-on-error: true
        with:
          testapp_dir: ftl-apps
          test_type: robo
          max_attempts: 2
          timeout: 120s
      - name: Assert step failed and summary records both attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          apps = s["apps"]
          def fail(m):
              print("FAIL: " + m); sys.exit(1)
          if len(apps) != 2: fail("expected 2 attempts, got %d" % len(apps))
          if sorted(a["attempt"] for a in apps) != [1, 2]: fail("attempt numbers wrong")
          for a in apps:
              if a["return_code"] != 10: fail("return_code should be 10")
              if "--timeout 120s" not in a["cmd"]: fail("timeout missing")
              if a["devices"][0]["outcome"] != "Failed": fail("outcome should be Failed")
          print("PASS")
          EOF
          calls=$(wc -l < /tmp/fake-gcloud-calls.log)
          echo "gcloud calls: $calls"
          if [ "$calls" -ne 2 ]; then
            echo "FAIL: expected 2 gcloud calls"
            exit 1
          fi
          echo "PASS"
