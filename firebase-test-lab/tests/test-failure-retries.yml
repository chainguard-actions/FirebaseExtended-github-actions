name: Test failing FTL run with retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup environment
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-env.sh"
      - name: Create failing fake gcloud and testapp
        run: |
          mkdir -p /tmp/ftl-apps/fail
          echo "fake apk" > /tmp/ftl-apps/fail/app.apk
          cat > /tmp/ftl-fakebin/gcloud <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/ftl-gcloud-calls.log
          echo "OUTCOME: Failed"
          echo "TEST_AXIS_VALUE: redfin-30-en-portrait"
          echo "TEST_DETAILS: 1 test cases failed"
          exit 10
          EOF
          chmod +x /tmp/ftl-fakebin/gcloud
      - id: action
        uses: .
        continue-on-error: true
        with:
          testapp_dir: /tmp/ftl-apps/fail
          test_type: robo
          max_attempts: 3
      - name: Assert action failed after retrying
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          echo "gcloud calls:"; cat /tmp/ftl-gcloud-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          CALLS="$(wc -l < /tmp/ftl-gcloud-calls.log)"
          if [ "$CALLS" -ne 3 ]; then
            echo "FAIL: expected 3 attempts, got $CALLS"; exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          apps = s["apps"]
          if [a["attempt"] for a in apps] != [1, 2, 3]: print("FAIL: attempts %r" % apps); sys.exit(1)
          if any(a["return_code"] != 10 for a in apps): print("FAIL: return codes"); sys.exit(1)
          if apps[0]["devices"][0]["outcome"] != "Failed": print("FAIL: outcome"); sys.exit(1)
          print("summary OK")
          EOF
          fi
          echo "PASS"
