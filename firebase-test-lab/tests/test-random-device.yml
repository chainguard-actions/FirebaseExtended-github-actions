name: Test random device selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and python
        run: bash tests/fixtures/setup-env.sh
      - name: Create testapp
        run: |
          mkdir -p ftl-apps
          echo "fake apk" > ftl-apps/app.apk
      - id: action
        uses: .
        with:
          testapp_dir: ftl-apps
          test_type: robo
          test_devices: model=redfin,version=30;model=oriole,version=33
          test_device_selection: random
          additional_flags: --num-flaky-test-attempts=1 --no-record-video
      - name: Assert exactly one device chosen and additional flags passed
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          def fail(m):
              print("FAIL: " + m); sys.exit(1)
          cmd = s["apps"][0]["cmd"]
          if cmd.count("--device ") != 1: fail("expected exactly one --device: " + cmd)
          if ("model=redfin,version=30" not in cmd) and ("model=oriole,version=33" not in cmd): fail("device not from list")
          for f in ["--num-flaky-test-attempts=1", "--no-record-video"]:
              if f not in cmd: fail("missing flag " + f)
          print("PASS")
          EOF
