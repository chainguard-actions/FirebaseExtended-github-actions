name: Test arg_groups mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: argfile-project
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup environment
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-env.sh"
      - name: Create fake gcloud
        run: |
          cat > /tmp/ftl-fakebin/gcloud <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/ftl-gcloud-calls.log
          echo "OUTCOME: Passed"
          echo "TEST_AXIS_VALUE: oriole-32-en-portrait"
          echo "TEST_DETAILS: --"
          exit 0
          EOF
          chmod +x /tmp/ftl-fakebin/gcloud
      - id: action
        uses: .
        with:
          arg_groups: args.yaml:group1;args.yaml:group2
          test_type: robo
      - name: Assert two commands were sent
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
        run: |
          echo "summary: $SUMMARY"
          echo "gcloud calls:"; cat /tmp/ftl-gcloud-calls.log
          python3 - <<'EOF'
          import json, os, sys
          s = json.loads(os.environ["SUMMARY"])
          def fail(msg):
              print("FAIL: " + msg); sys.exit(1)
          if s.get("project_id") != "argfile-project": fail("project_id %r" % s.get("project_id"))
          cmds = sorted(a["cmd"] for a in s["apps"])
          exp = ["gcloud firebase test android run args.yaml:group1",
                 "gcloud firebase test android run args.yaml:group2"]
          if cmds != exp: fail("cmds %r" % cmds)
          if any(a["return_code"] != 0 for a in s["apps"]): fail("return codes")
          print("PASS")
          EOF
          if [ "$(wc -l < /tmp/ftl-gcloud-calls.log)" -ne 2 ]; then
            echo "FAIL: expected 2 gcloud calls"; exit 1
          fi
