name: Test workload identity auth without OIDC fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake gcloud and testapps
        run: |
          bash tests/fixtures/setup-fake-env.sh
          mkdir -p "$RUNNER_TEMP/testapps"
          echo "fake apk" > "$RUNNER_TEMP/testapps/app.apk"
      - id: action
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/fake-pool/providers/fake-provider
          service_account: fake-sa@not-real.iam.gserviceaccount.com
          testapp_dir: ${{ runner.temp }}/testapps
          test_type: robo
      - name: Assert action failed during authentication
        env:
          SUMMARY: ${{ steps.action.outputs.test_summary }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure (no OIDC token under act)"; exit 1; fi
          if [ -n "$SUMMARY" ]; then echo "FAIL: expected empty summary (FTL step must not run)"; exit 1; fi
          if [ -s /tmp/fake-gcloud-calls.log ]; then echo "FAIL: gcloud should not be called"; cat /tmp/fake-gcloud-calls.log; exit 1; fi
          echo "PASS"
